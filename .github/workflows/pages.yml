name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Statische Dateien prüfen
        run: |
          set -e
          for f in index.html manifest.webmanifest sw.js css/app.css js/app.js \
                   icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png; do
            test -f "$f" || { echo "Fehlt: $f"; exit 1; }
          done
          node --check js/app.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          echo "Alles da."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
